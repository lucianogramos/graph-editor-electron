<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Graph Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root">
        <header id="title-bar">
            <div class="flex items-center gap-1">
                <div class="relative">
                    <button class="title-bar-option" data-dropdown-trigger="file-menu">Arquivo</button>
                    
                    <div id="file-menu" class="title-bar-dropdown-menu">
                        <div class="title-bar-dropdown-menu-section">
                            <button class="title-bar-dropdown-menu-option">
                                <span>Novo Grafo</span>
                                <span class="title-bar-dropdown-menu-option-shortcut">CTRL + N</span>
                            </button>
                            <button class="title-bar-dropdown-menu-option">
                                <span>Abrir Grafo...</span>
                                <span class="title-bar-dropdown-menu-option-shortcut">CTRL + O</span>
                            </button>
                            <button class="title-bar-dropdown-menu-option">
                                <span>Salvar Grafo</span>
                                <span class="title-bar-dropdown-menu-option-shortcut">CTRL + S</span>
                            </button>
                            <button id="quit-button" class="title-bar-dropdown-menu-option">Sair</button>
                        </div>
                    </div>
                </div>

                <div class="relative">
                    <button class="title-bar-option" data-dropdown-trigger="edit-menu">Editar</button>
                    
                    <div id="edit-menu" class="title-bar-dropdown-menu">
                        <div class="title-bar-dropdown-menu-section">
                            <button class="title-bar-dropdown-menu-option">
                                <span>Desfazer</span>
                                <span class="title-bar-dropdown-menu-option-shortcut">CTRL + Z</span>
                            </button>
                            <button class="title-bar-dropdown-menu-option">
                                <span>Refazer</span>
                                <span class="title-bar-dropdown-menu-option-shortcut">CTRL + Y</span>
                            </button>
                        </div>
                        <div class="divider"></div>
                        <div class="title-bar-dropdown-menu-section">
                            <button class="title-bar-dropdown-menu-option">
                                <span>Adicionar Vértice</span>
                                <span class="title-bar-dropdown-menu-option-shortcut">CTRL + B</span>
                            </button>
                            <button class="title-bar-dropdown-menu-option">
                                <span>Adicionar Aresta</span>
                                <span class="title-bar-dropdown-menu-option-shortcut">CTRL + E</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="relative">
                    <button class="title-bar-option" data-dropdown-trigger="algorithms-menu">Algoritmos</button>
                    
                    <div id="algorithms-menu" class="title-bar-dropdown-menu">
                        <div class="title-bar-dropdown-menu-section">
                            <button class="title-bar-dropdown-menu-option">DFS</button>
                            <button class="title-bar-dropdown-menu-option">BFS</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="toggle-theme-button" class="ml-auto flex items-center rounded-full cursor-pointer hover:bg-surface-2 active:bg-surface-3 p-1 group">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5 self-center shrink-0 text-secondary hidden group-data-[theme=light]:block"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5 self-center shrink-0 text-secondary hidden group-data-[theme=dark]:block"><path d="M565-395q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Zm-226.5 56.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>
            </div>
        </header>
        <div id="main-container" class="w-full h-full flex gap-2 p-2">
            <div class="relative h-full w-full border border-border-color rounded-lg">
                <div id="editor" class="w-full h-full rounded-lg overflow-hidden scrollbar-none"></div>
                <div class="absolute flex flex-col right-1 top-[50%] translate-y-[-50%] w-10 border border-border-color rounded-lg bg-surface-1">
                    <button id="btn-select-tool" class="tool-option"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-7 h-7 self-center shrink-0"><path d="m333-463 56-79h134L333-692v229ZM567 7 407-334 197-39v-932l720 565H557L717-64 567 7ZM389-542Z"/></svg></button>
                    <button id="btn-vertex-tool" class="tool-option"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-7 h-7 self-center shrink-0"><path d="M530-15.6q-13 .6-24.83 1.1-11.84.5-25.17.5-97 0-181.5-36.5t-148-100Q87-214 50.5-298.5T14-479.92q0-96.92 36.45-181.53 36.44-84.61 100-148.08Q214-873 298.5-909.5 383-946 479.95-946q96.96 0 181.6 36.37t148.13 99.79q63.49 63.42 99.91 147.96Q946-577.34 946-480q0 13.5-.5 26t-1.5 26l-118-36v-16q0-144-101-245T480-826q-144 0-245 101T134-480q0 144 101 245t245 101h14l36 118.4ZM836-29 658-208 607-55 480-480l425 127-153 51 179 178-95 95Z"/></svg></button>
                    <button id="btn-edge-tool" class="tool-option peer/edge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-7 h-7 self-center shrink-0"><path d="M774.65-34q-63.07 0-106.86-43.75T624-185q0-12.92 2-24.92 2-12 5-24.08L235.08-632q-11.79 4-24.23 6-12.45 2-25.85 2-63.5 0-107.25-43.73Q34-711.47 34-774.82q0-63.36 43.73-107.27Q121.47-926 184.82-926q63.36 0 107.77 44.09Q337-837.83 337-774.85q0 12.04-2 24.79t-5 23.82L726.21-328q10.79-4 23.14-6.5Q761.7-337 775-337q62.92 0 106.96 44.35Q926-248.3 926-184.94q0 63.36-44.14 107.15Q837.71-34 774.65-34Z"/></svg></button>
                    <div class="absolute hidden flex-col right-11 top-[50%] translate-y-[-50%] w-8 border border-border-color rounded-lg bg-surface-1 peer-data-[selected=true]/edge:flex">
                        <button id="edge-directed-option" class="tool-option" data-value="directed"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5 self-center shrink-0"><path d="m415-155 121-257H52v-136h484L415-805l511 325-511 325Z"/></svg></button>
                        <button id="edge-undirected-option" class="tool-option" data-value="undirected"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5 self-center shrink-0"><path d="M154-412v-136h652v136H154Z"/></svg></button>
                        <button id="edge-weighted-option" class="tool-option" data-value="weighted"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5 self-center shrink-0"><path d="m519-61-83-83 143-142-293-293-142 143-83-83 57-56-59-60 86-86-60-59 95-95 59 60 86-86 60 59 56-57 83 83-143 142 293 293 142-143 83 83-57 56 59 60-86 86 60 59-95 95-59-60-86 86-60-59-56 57Z"/></svg></button>
                        <button id=" edge-unweighted-option" class="tool-option" data-value="unweighted"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5 self-center shrink-0"><path d="M289.5-249.5Q217-342 217-480q0-141 72.5-232T480-803q118 0 190.5 92.5T743-480q0 138-72.5 230.5T480-157q-118 0-190.5-92.5ZM573-347.21q31-58.21 31-132.79 0-74.58-31-132.79Q542-671 480-671t-93 58.21Q356-554.58 356-480q0 74.58 31 132.79Q418-289 480-289t93-58.21Z"/></svg></button>
                    </div>
                    <button id="btn-erase-tool" class="tool-option"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-7 h-7 self-center shrink-0"><path d="M781-248h156v136H645l136-136ZM146-112l-91-91q-40-40-40-95.5T55-395l435-439q39.16-40 95.58-40T682-834l180 180q39 40 39.5 96.5T862-462L516-112H146Zm312.63-136L765-557 586-738 152-299.14 202-248h256.63ZM480-480Z"/></svg></button>

                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./renderer.js"></script>
</body>
