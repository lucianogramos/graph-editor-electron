<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Graph Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root">
        <header id="title-bar">
            <div class="relative">
                <button class="title-bar-option" data-dropdown-trigger="file-menu">Arquivo</button>
                
                <div id="file-menu" class="title-bar-dropdown-menu">
                    <div class="title-bar-dropdown-menu-section">
                        <button class="title-bar-dropdown-menu-option">
                            <span>Novo Grafo</span>
                            <span class="title-bar-dropdown-menu-option-shortcut">CTRL + N</span>
                        </button>
                        <button class="title-bar-dropdown-menu-option">
                            <span>Abrir Grafo...</span>
                            <span class="title-bar-dropdown-menu-option-shortcut">CTRL + O</span>
                        </button>
                        <button class="title-bar-dropdown-menu-option">
                            <span>Salvar Grafo</span>
                            <span class="title-bar-dropdown-menu-option-shortcut">CTRL + S</span>
                        </button>
                        <button id="quit-button" class="title-bar-dropdown-menu-option">Sair</button>
                    </div>
                </div>
            </div>

            <div class="relative">
                <button class="title-bar-option" data-dropdown-trigger="edit-menu">Editar</button>
                
                <div id="edit-menu" class="title-bar-dropdown-menu">
                    <div class="title-bar-dropdown-menu-section">
                        <button class="title-bar-dropdown-menu-option">
                            <span>Desfazer</span>
                            <span class="title-bar-dropdown-menu-option-shortcut">CTRL + Z</span>
                        </button>
                        <button class="title-bar-dropdown-menu-option">
                            <span>Refazer</span>
                            <span class="title-bar-dropdown-menu-option-shortcut">CTRL + Y</span>
                        </button>
                    </div>
                    <div class="divider"></div>
                    <div class="title-bar-dropdown-menu-section">
                        <button class="title-bar-dropdown-menu-option">
                            <span>Adicionar Vértice</span>
                            <span class="title-bar-dropdown-menu-option-shortcut">CTRL + B</span>
                        </button>
                        <button class="title-bar-dropdown-menu-option">
                            <span>Adicionar Aresta</span>
                            <span class="title-bar-dropdown-menu-option-shortcut">CTRL + E</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="relative">
                <button class="title-bar-option" data-dropdown-trigger="algorithms-menu">Algoritmos</button>
                
                <div id="algorithms-menu" class="title-bar-dropdown-menu">
                    <div class="title-bar-dropdown-menu-section">
                        <button class="title-bar-dropdown-menu-option">DFS</button>
                        <button class="title-bar-dropdown-menu-option">BFS</button>
                    </div>
                </div>
            </div>
        </header>
        <div id="main-container" class="w-full h-full flex gap-2 p-2">
            <div class="relative h-full w-full border border-border-color rounded-lg">
                <div id="editor" class="w-full h-full rounded-lg overflow-hidden"></div>
                <div class="absolute flex flex-col right-1 top-[50%] translate-y-[-50%] w-10 border border-border-color rounded-lg bg-surface-1">
                    <button class="tool-option"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-7 h-7 self-center shrink-0"><path d="m333-463 56-79h134L333-692v229ZM567 7 407-334 197-39v-932l720 565H557L717-64 567 7ZM389-542Z"/></svg></button>
                    <button class="tool-option" data-selected="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-7 h-7 self-center shrink-0"><path d="M530-15.6q-13 .6-24.83 1.1-11.84.5-25.17.5-97 0-181.5-36.5t-148-100Q87-214 50.5-298.5T14-479.92q0-96.92 36.45-181.53 36.44-84.61 100-148.08Q214-873 298.5-909.5 383-946 479.95-946q96.96 0 181.6 36.37t148.13 99.79q63.49 63.42 99.91 147.96Q946-577.34 946-480q0 13.5-.5 26t-1.5 26l-118-36v-16q0-144-101-245T480-826q-144 0-245 101T134-480q0 144 101 245t245 101h14l36 118.4ZM836-29 658-208 607-55 480-480l425 127-153 51 179 178-95 95Z"/></svg></button>
                    <button class="tool-option"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-7 h-7 self-center shrink-0"><path d="M774.65-34q-63.07 0-106.86-43.75T624-185q0-12.92 2-24.92 2-12 5-24.08L235.08-632q-11.79 4-24.23 6-12.45 2-25.85 2-63.5 0-107.25-43.73Q34-711.47 34-774.82q0-63.36 43.73-107.27Q121.47-926 184.82-926q63.36 0 107.77 44.09Q337-837.83 337-774.85q0 12.04-2 24.79t-5 23.82L726.21-328q10.79-4 23.14-6.5Q761.7-337 775-337q62.92 0 106.96 44.35Q926-248.3 926-184.94q0 63.36-44.14 107.15Q837.71-34 774.65-34Z"/></svg></button>
                    <button class="tool-option"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-7 h-7 self-center shrink-0"><path d="M781-248h156v136H645l136-136ZM146-112l-91-91q-40-40-40-95.5T55-395l435-439q39.16-40 95.58-40T682-834l180 180q39 40 39.5 96.5T862-462L516-112H146Zm312.63-136L765-557 586-738 152-299.14 202-248h256.63ZM480-480Z"/></svg></button>
                </div>
            </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="./renderer.js"></script>
</body>
</html>
